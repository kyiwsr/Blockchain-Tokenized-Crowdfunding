<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Tokenized Crowdfunding</title>
</head>
<body>

    <div class="goal">
        <h2>TARGET : ETH XXX.XXXX</h2>
    </div>

    <div class="raised-amount">
        <h1>ETH XXX.XXXX</h1>
    </div>

    <div class="goal-date-time">
        <p id="date-goal">DUE DATE : 27/05/2025<time datetime="2025-05-27"></time></p>
        <p id="time-left">TIME LEFT : 00:16:43<time datetime="14:42"></time></p>
    </div>

    <div class="btn">
        <button type="button" class="btn donate">Donate</button>
        <button type="button" class="btn refund">Refund</button>
    </div>


</body>
</html>

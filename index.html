<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Tokenized Crowdfunding</title>
</head>
<body>

    <div class="goal">
        <h2>TARGET : ETH <span class="goal-amount">XXX.XXXX</span> </h2>
    </div>

    <div class="amount">
        <h1>ETH <span class="raised-amount">XXX.XXXX</span></h1>
    </div>

    <div class="goal-date-time">
        <p id="date-goal">DUE DATE : <span>27/05/2025</span><time datetime="2025-05-27"></time></p>
        <p id="time-left">TIME LEFT : <span>00:16:43</span><time datetime="14:42"></time></p>
    </div>

    <div class="input">
        <label for="input">Enter Amount:</label> <br>
        <input type="number" id="input" min="0.001" step="0.001">
    </div>

    <div class="btn">
        <button type="button" class="btn donate">Donate</button>
        <button type="button" class="btn refund">Refund</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"> </script>  
    
    <script src="index.js"></script>

</body>
</html>
